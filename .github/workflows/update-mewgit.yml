name: Update the mewgit formula

# yshrsmz/mewgit のリリースのワークフローが、Release を公開した後にバージョンだけを送ってくる。
# payload はバージョンの形式を確かめてから使い、URL はここで組み立てる。
# Release には macOS / Linux（どちらも arm64）の tar.gz・SHA-256 と Formula（mewgit.rb）が添付されている。
# tar.gz と Formula は、mewgit の main のリリースのワークフローが作ったことを build provenance attestation で
# 確かめる（添付ファイルは書き込み権限があれば差し替えられるため）。さらに Formula の URL の版と sha256 が、
# 知らせのバージョンと自分で計算した tar.gz の SHA-256 に一致することを確かめてから、その Formula を使う。
# いまの Formula より新しい版のときだけ、Formula を PR で更新し、ci が通ったら自動でマージする。
# 形は update-mewbell.yml と同じで、違うのは Formula であることと、tar.gz が 2 つあること。

on:
  repository_dispatch:
    types: [mewgit-released]

permissions:
  contents: read
  # 開いている Formula の PR の版を読む
  pull-requests: read

concurrency:
  group: update-mewgit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      VERSION: ${{ github.event.client_payload.version }}
    steps:
      - name: Validate the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "バージョンの形式が X.Y.Z ではありません" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 同じ版の知らせのやり直しや、古い版の知らせで Formula を戻さない。main の Formula に加えて、
      # 開いている Formula の PR（mewgit-X.Y.Z）の版とも比べる（遅れて届いた古い版で新しい版の PR を閉じない）。
      # Formula は version を書かない（brew audit --strict が URL との重複で断る）ので、版は URL から読む
      - id: compare
        name: Compare with the current formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=""
          if [[ -f Formula/mewgit.rb ]]; then
            current="$(sed -n 's|^ *url "https://github.com/yshrsmz/mewgit/releases/download/v\([0-9.]*\)/.*"$|\1|p' Formula/mewgit.rb | head -n 1)"
          fi
          if [[ -n "$current" && "$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]] ||
            [[ "$current" == "$VERSION" ]]; then
            echo "いまの Formula は ${current} なので、${VERSION} への更新はしません"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          pending="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '.[].headRefName | select(test("^mewgit-[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("mewgit-")')"
          for version in $pending; do
            if [[ "$version" != "$VERSION" && "$(printf '%s\n' "$version" "$VERSION" | sort -V | tail -n 1)" == "$version" ]]; then
              echo "${version} の PR が開いているので、${VERSION} への更新はしません"
              echo "skip=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done

      - name: Download and verify the release
        if: steps.compare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/yshrsmz/mewgit/releases/download/v$VERSION"
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          archives=(
            "mewgit-v$VERSION-aarch64-apple-darwin.tar.gz"
            "mewgit-v$VERSION-aarch64-unknown-linux-gnu.tar.gz"
          )
          for file in "${archives[@]}" "${archives[@]/%/.sha256}" mewgit.rb; do
            curl -fsSL --proto '=https' --tlsv1.2 -o "$dir/$file" "$base/$file"
          done

          for file in "${archives[@]}" mewgit.rb; do
            gh attestation verify "$dir/$file" \
              --repo yshrsmz/mewgit \
              --signer-workflow yshrsmz/mewgit/.github/workflows/release.yml \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done

          for file in "${archives[@]}"; do
            # ダウンロードの破損を見つける
            expected="$(cut -d ' ' -f 1 "$dir/$file.sha256")"
            actual="$(sha256sum "$dir/$file" | cut -d ' ' -f 1)"
            if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
              echo "$file の SHA-256 が一致しません（計算: ${actual}、添付: ${expected}）" >&2
              exit 1
            fi
            # 別の版の Formula を差し込まれていないか（attestation は Formula とバージョンを結び付けない）
            if ! grep -qxF "    url \"$base/$file\"" "$dir/mewgit.rb" ||
              ! grep -qxF "    sha256 \"$actual\"" "$dir/mewgit.rb"; then
              echo "Formula の url か sha256 が ${file} と一致しません" >&2
              exit 1
            fi
          done
          # 上で確かめた 2 つの url 以外の取得先が無いこと
          urls="$(grep -c '^ *url ' "$dir/mewgit.rb" || true)"
          if [[ "$urls" != 2 ]]; then
            echo "Formula の url が 2 つではありません: ${urls}" >&2
            exit 1
          fi
          cat "$dir/mewgit.rb"

      - id: app-token
        if: steps.compare.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      # git の資格情報を使わずに API でコミットする（コミットは App の名前で署名される）。
      # 古い版の PR が開いていれば閉じる（同じ Formula/mewgit.rb を変えるので、残すと衝突して auto-merge が止まる）。
      # この版の PR が開いていれば、そのブランチに書く（開いている PR を一時的に空にしない）。
      # PR の無いブランチが残っていれば、main から作り直す
      - name: Open a pull request
        if: steps.compare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="mewgit-$VERSION"
          path="Formula/mewgit.rb"
          repo="$GITHUB_REPOSITORY"

          gh pr list --repo "$repo" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("mewgit-")) | "\(.number) \(.headRefName)"' |
            while read -r number head; do
              if [[ "$head" != "$branch" ]]; then
                gh pr close "$number" --repo "$repo" --delete-branch \
                  --comment "mewgit $VERSION の PR に置き換えます"
              fi
            done

          open_pr="$(gh pr list --repo "$repo" --state open --head "$branch" --json number --jq '.[].number')"
          if [[ -z "$open_pr" ]]; then
            if gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>"$RUNNER_TEMP/ref.err"; then
              gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
            elif ! grep -q "HTTP 404" "$RUNNER_TEMP/ref.err"; then
              cat "$RUNNER_TEMP/ref.err" >&2
              exit 1
            fi
            base="$(gh api "repos/$repo/git/ref/heads/main" --jq .object.sha)"
            gh api "repos/$repo/git/refs" -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          fi

          args=()
          if current="$(gh api "repos/$repo/contents/$path?ref=$branch" --jq .sha 2>"$RUNNER_TEMP/contents.err")"; then
            args=(-f sha="$current")
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/contents.err"; then
            cat "$RUNNER_TEMP/contents.err" >&2
            exit 1
          fi
          gh api -X PUT "repos/$repo/contents/$path" \
            -f message="mewgit $VERSION" \
            -f branch="$branch" \
            -f content="$(base64 -w 0 "$RUNNER_TEMP/release/mewgit.rb")" \
            "${args[@]}" >/dev/null

          if [[ -z "$open_pr" ]]; then
            gh pr create --repo "$repo" --base main --head "$branch" \
              --title "mewgit $VERSION" \
              --body "https://github.com/yshrsmz/mewgit/releases/tag/v$VERSION"
          fi
          gh pr merge --repo "$repo" "$branch" --auto --squash
