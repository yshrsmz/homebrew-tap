name: Update the Mewbell cask

# yshrsmz/mewbell のリリースのワークフローが、Release を公開した後にバージョンだけを送ってくる。
# payload はバージョンの形式を確かめてから使い、URL はここで組み立てる。Cask の雛形はそのタグの
# packaging/homebrew/mewbell.rb.template を使う（mewbell 側で公開の前に brew style と brew audit を通している）。
# SHA-256 は自分で計算し、Release に添付された値と照らし合わせる（ダウンロードの破損を見つける）。
# 添付ファイルは書き込み権限があれば差し替えられるので、zip が mewbell の main のリリースのワークフローで
# 作られたことを build provenance attestation で確かめる。
# いまの Cask より新しい版のときだけ、Cask を PR で更新し、ci が通ったら自動でマージする。

on:
  repository_dispatch:
    types: [mewbell-released]

permissions:
  contents: read

concurrency:
  group: update-mewbell
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    env:
      VERSION: ${{ github.event.client_payload.version }}
    steps:
      - name: Validate the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "バージョンの形式が X.Y.Z ではありません" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 同じ版の知らせのやり直しや、古い版の知らせで Cask を戻さない
      - id: compare
        name: Compare with the current cask
        run: |
          current=""
          if [[ -f Casks/mewbell.rb ]]; then
            current="$(sed -n 's/^  version "\([0-9.]*\)"$/\1/p' Casks/mewbell.rb)"
          fi
          newest="$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n 1)"
          if [[ -n "$current" && ( "$current" == "$VERSION" || "$newest" != "$VERSION" ) ]]; then
            echo "いまの Cask は ${current} なので、${VERSION} への更新はしません"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Download and verify the release
        if: steps.compare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/yshrsmz/mewbell/releases/download/v$VERSION"
          zip="$RUNNER_TEMP/Mewbell-$VERSION.zip"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$zip" "$base/Mewbell-$VERSION.zip"
          expected="$(curl -fsSL --proto '=https' --tlsv1.2 "$base/Mewbell-$VERSION.zip.sha256" | cut -d ' ' -f 1)"
          actual="$(sha256sum "$zip" | cut -d ' ' -f 1)"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo "SHA-256 が一致しません（計算: ${actual}、添付: ${expected}）" >&2
            exit 1
          fi
          gh attestation verify "$zip" \
            --repo yshrsmz/mewbell \
            --signer-workflow yshrsmz/mewbell/.github/workflows/release.yml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          echo "SHA256=$actual" >>"$GITHUB_ENV"

      - name: Render the cask
        if: steps.compare.outputs.skip != 'true'
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/mewbell.rb.template" \
            "https://raw.githubusercontent.com/yshrsmz/mewbell/v$VERSION/packaging/homebrew/mewbell.rb.template"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA256/g" \
            "$RUNNER_TEMP/mewbell.rb.template" >"$RUNNER_TEMP/mewbell.rb"
          cat "$RUNNER_TEMP/mewbell.rb"

      - id: app-token
        if: steps.compare.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      # git の資格情報を使わずに API でコミットする（コミットは App の名前で署名される）。
      # 前の試みのブランチが残っていても main に戻さず、その上に書く（開いている PR を空にしない）
      - name: Open a pull request
        if: steps.compare.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="mewbell-$VERSION"
          path="Casks/mewbell.rb"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>"$RUNNER_TEMP/ref.err"; then
            grep -q "HTTP 404" "$RUNNER_TEMP/ref.err" || { cat "$RUNNER_TEMP/ref.err" >&2; exit 1; }
            base="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          fi
          args=()
          if current="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" --jq .sha 2>"$RUNNER_TEMP/contents.err")"; then
            args=(-f sha="$current")
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/contents.err"; then
            cat "$RUNNER_TEMP/contents.err" >&2
            exit 1
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="mewbell $VERSION" \
            -f branch="$branch" \
            -f content="$(base64 -w 0 "$RUNNER_TEMP/mewbell.rb")" \
            "${args[@]}" >/dev/null
          if [[ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --json number --jq '.[].number')" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "mewbell $VERSION" \
              --body "https://github.com/yshrsmz/mewbell/releases/tag/v$VERSION"
          fi
          gh pr merge --repo "$GITHUB_REPOSITORY" "$branch" --auto --squash
