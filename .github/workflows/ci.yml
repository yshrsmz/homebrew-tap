name: ci

# Cask と Formula の変更を brew style と brew audit で確かめる。main の ruleset でこのチェックを必須にしている。
# brew audit --cask を確実に動かすため macOS で動かす。

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap this checkout
        run: |
          brew tap yshrsmz/tap "$GITHUB_WORKSPACE"
          brew trust --tap yshrsmz/tap

      # tap 全体に brew style をかけるとワークフローにも actionlint がかかるので、Cask と Formula だけを対象にする
      - name: brew style and brew audit
        run: |
          shopt -s nullglob
          for cask in Casks/*.rb; do
            name="yshrsmz/tap/$(basename "$cask" .rb)"
            brew style --cask "$name"
            brew audit --cask --strict "$name"
          done
          for formula in Formula/*.rb; do
            name="yshrsmz/tap/$(basename "$formula" .rb)"
            brew style --formula "$name"
            brew audit --formula --strict "$name"
          done
